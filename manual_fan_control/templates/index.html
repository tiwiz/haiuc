<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .on {
            background-color: #4CAF50; /* Green */
            color: white;
        }
        .off {
            background-color: #f44336; /* Red */
            color: white;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fan Control</h1>
        <p>Current Fan State: <span id="fanState">{{ fan_state }}</span></p>
        <button id="toggleButton" class="{{ 'on' if fan_state == 'off' else 'off' }}">
            Turn {{ 'On' if fan_state == 'off' else 'Off' }}
        </button>
    </div>

    <script>
        const toggleButton = document.getElementById('toggleButton');
        const fanStateSpan = document.getElementById('fanState');

        toggleButton.addEventListener('click', async () => {
            const response = await fetch('/toggle_fan', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            const data = await response.json();
            if (data.status === 'success') {
                fanStateSpan.textContent = data.new_state;
                if (data.new_state === 'on') {
                    toggleButton.classList.remove('on');
                    toggleButton.classList.add('off');
                    toggleButton.textContent = 'Turn Off';
                } else {
                    toggleButton.classList.remove('off');
                    toggleButton.classList.add('on');
                    toggleButton.textContent = 'Turn On';
                }
            }
        });
    </script>
</body>
</html>
